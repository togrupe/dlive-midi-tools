<title>Support dlive-midi-tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Indirection layer so the app never hardcodes a specific donation
  platform. If the platform changes, only this file needs updating —
  existing app installs keep working without a new release.
-->
<meta http-equiv="refresh" content="0; url=https://buymeacoffee.com/togrupe">
<link rel="canonical" href="https://buymeacoffee.com/togrupe">
<script>window.location.replace("https://buymeacoffee.com/togrupe");</script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
    padding: 4rem 1rem;
    color: #333;
  }
  a { color: #8E44AD; }
</style>
</head>
<body>
  <p>Redirecting to the donation page…</p>
  <p>If you are not redirected automatically, <a href="https://buymeacoffee.com/togrupe">click here</a>.</p>
</body>
</html>
